name: iOS CI

# develop 푸시는 PR이 읽을 캐시를 만드는 실행
on:
  pull_request:
  push:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.githooks/**'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'

# 같은 PR이나 브랜치에 새 푸시가 오면 진행 중인 앞 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: DevLog.xcworkspace
  TEST_SCHEME: DevLog-Tests
  XCODE_VERSION: "27.2"

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  # 코드가 아닌 파일만 바뀐 PR의 Build and Test 건너뜀
  # 트리거 경로 조건은 필수 체크를 대기 상태로 남기므로 잡 조건으로 판정
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          # 이름이 바뀐 파일은 이전 경로도 검사
          files=$(gh api --paginate "$PR_FILES" --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '\.md$|^docs/|^\.githooks/|^fastlane/|^Gemfile(\.lock)?$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # 테스트 타깃까지 한 번 컴파일하고 같은 러너에서 테스트만 실행
  # develop 실행은 패키지와 컴파일 캐시 저장용 빌드
  # Changes 잡이 실패하면 건너뛰지 않고 실행
  ci:
    name: Build and Test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      build: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: Libraries/MarkdownRenderer/Tooling/.node-version
          cache: npm
          cache-dependency-path: Libraries/MarkdownRenderer/Tooling/package-lock.json

      - name: Check Markdown renderer
        working-directory: Libraries/MarkdownRenderer/Tooling
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          npm run verify

          RENDERER_OUTPUT="../Resources/MarkdownRenderer"

          node --check "$RENDERER_OUTPUT/renderer.js"
          git -C ../../.. diff --exit-code -- \
            Libraries/MarkdownRenderer/Resources/MarkdownRenderer/index.html \
            Libraries/MarkdownRenderer/Resources/MarkdownRenderer/renderer.css \
            Libraries/MarkdownRenderer/Resources/MarkdownRenderer/renderer.js

      # private 저장소 인증값은 이 스텝에만 전달해 다른 스텝의 프로세스 환경에 남기지 않음
      - name: Install private config files
        uses: ./.github/actions/install-private-config
        with:
          git_url: ${{ secrets.MATCH_GIT_URL }}
          git_basic_authorization: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          environment: staging

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ "$XCODE_VERSION" = "latest" ]; then
            XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -type d | sort -V | tail -n 1)"
          else
            XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
            if [ ! -d "$XCODE_APP" ]; then
              XCODE_APP="/Applications/Xcode-${XCODE_VERSION}.app"
            fi
          fi

          if [ ! -d "${XCODE_APP:-}" ]; then
            echo "Requested Xcode not found for version: $XCODE_VERSION" >&2
            exit 1
          fi

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"

      - name: Set up Tuist
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install SwiftLint
        env:
          HOMEBREW_REQUIRE_TAP_TRUST: "1"
        shell: bash
        run: |
          set -euo pipefail

          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint version

      # 키가 없을 때만 develop 실행이 저장
      - name: Restore SwiftPM packages
        id: packages
        uses: actions/cache/restore@v5
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('.mise.toml', 'Tuist.swift', 'Workspace.swift', 'Tuist/ProjectDescriptionHelpers/*.swift', 'Application/**/Project.swift', 'Libraries/**/Project.swift', 'Widget/**/Project.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-

      # develop 실행은 처음부터 빌드해 커밋마다 저장하고 PR은 가장 최근 develop 캐시만 읽음
      - name: Restore compilation cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/compilation-cache
          key: compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.version }}-arm64-${{ github.sha }}
          restore-keys: |
            compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.version }}-arm64-

      - name: Generate Xcode workspace with Tuist
        shell: bash
        run: |
          set -euo pipefail

          tuist generate --no-open

      # 시뮬레이터 x86_64 슬라이스는 CI에서 만들지 않음
      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          set -x
          # tuist generate가 패키지를 해석한 경로를 그대로 써서 패키지를 다시 풀지 않음
          SPM_DIR="$GITHUB_WORKSPACE/.spm/DevLog"
          mkdir -p "$SPM_DIR"

          xcodebuild -version

          echo "Using scheme: $TEST_SCHEME"

          set -o pipefail
          set +e
          echo "== Starting xcodebuild build-for-testing =="
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$TEST_SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/compilation-cache" \
            SWIFT_ENABLE_EXPLICIT_MODULES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing \
            | tee build.log
          XC_STATUS=${PIPESTATUS[0]}
          echo "== xcodebuild finished =="
          set -e

          exit $XC_STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build
          path: build.log
          if-no-files-found: ignore

      - name: Select iOS Simulator Runtime (installed)
        id: pick_ios
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          RESULT=$(python3 - <<'PY'
          import re, subprocess, sys

          def ver_key(version):
            return tuple(int(part) for part in version.split('.'))

          text = subprocess.check_output(["xcrun", "simctl", "list", "devices"], text=True)
          lines = text.splitlines()
          current_ver = None
          candidates = []

          for line in lines:
            header = re.match(r"^-- iOS ([0-9]+(?:\.[0-9]+)*) --$", line.strip())
            if header:
              current_ver = header.group(1)
              continue
            if current_ver is None:
              continue
            if "(unavailable)" in line:
              continue
            if "iPhone" not in line:
              continue

            raw = line.strip()
            udid = re.search(r"\(([0-9A-Fa-f-]{36})\)", raw)
            if udid is None:
              continue

            if "platform:" in raw and "name:" in raw and "OS:" in raw:
              kv = {}
              for part in raw.split(","):
                if ":" not in part:
                  continue
                k, v = part.split(":", 1)
                kv[k.strip()] = v.strip()
              name = kv.get("name", raw)
            else:
              name = raw
              name = re.sub(r"\s+\([0-9A-Fa-f-]{36}\)\s+\(.*\)$", "", name)

            candidates.append((current_ver, name, udid.group(1)))

          if len(candidates) <= 0:
            print("No available iPhone simulators found", file=sys.stderr)
            sys.exit(1)

          latest_version = max((candidate[0] for candidate in candidates), key=ver_key)
          latest_candidates = [
            candidate for candidate in candidates
            if candidate[0] == latest_version
          ]
          chosen_version, chosen_device_name, chosen_device_id = min(
            latest_candidates,
            key=lambda candidate: candidate[1]
          )

          print(f"{chosen_version}|{chosen_device_name}|{chosen_device_id}")
          sys.exit(0)
          PY
          )

          if [ -z "${RESULT:-}" ]; then
            echo "No iPhone simulator devices detected." >&2
            exit 1
          fi

          IFS='|' read -r IOS_VER DEVICE_NAME DEVICE_ID <<< "$RESULT"

          echo "Chosen iOS runtime version (iPhone): $IOS_VER"
          echo "Chosen simulator: $DEVICE_NAME ($DEVICE_ID)"

          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      # simslim은 부팅과 테스트 시간을 줄이는 최적화이고 테스트는 simslim이 끄는 데몬에 의존하지 않음
      # 설치나 적용이 실패하면 경고만 남기고 기본 상태 시뮬레이터로 진행
      - name: Install simslim
        id: simslim
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SIMSLIM_VERSION: 0.12.2
          SIMSLIM_SHA256: b47302da6fb83b8b4c21f4fdd61507469770c07b0ff07fd1f48207bda4270887
        run: |
          archive="$RUNNER_TEMP/simslim.tar.gz"
          directory="$RUNNER_TEMP/simslim"
          mkdir -p "$directory"
          if curl -fsSL --retry 3 -o "$archive" "https://github.com/MobAI-App/simslim/releases/download/v$SIMSLIM_VERSION/simslim-v$SIMSLIM_VERSION-macos-arm64.tar.gz" \
            && echo "$SIMSLIM_SHA256  $archive" | shasum -a 256 -c - \
            && tar -xzf "$archive" -C "$directory" simslim \
            && "$directory/simslim" --version; then
            echo "path=$directory/simslim" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=simslim::설치에 실패해 기본 상태 시뮬레이터로 진행"
          fi

      # 종료 상태의 시뮬레이터에 적용하면 simslim이 비활성화 목록을 기록한 뒤 한 번만 부팅
      # 제한 시간이 지나도 진행 중인 부팅은 다음 단계가 기다림
      - name: Slim simulator
        if: github.event_name == 'pull_request' && steps.simslim.outputs.path != ''
        continue-on-error: true
        timeout-minutes: 4
        env:
          SIMSLIM: ${{ steps.simslim.outputs.path }}
          SIMSLIM_BOOT_TIMEOUT: 3m
          DEVICE_ID: ${{ steps.pick_ios.outputs.device_id }}
        run: |
          if "$SIMSLIM" on "$DEVICE_ID"; then
            "$SIMSLIM" status "$DEVICE_ID" || true
          else
            echo "::warning title=simslim::적용에 실패해 기본 상태 시뮬레이터로 진행"
          fi

      - name: Boot simulator
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          DEVICE_ID: ${{ steps.pick_ios.outputs.device_id }}
        run: |
          # 종료 상태가 아니면 부팅 명령을 보내지 않음
          if xcrun simctl list devices | grep "$DEVICE_ID" | grep -q "(Shutdown)"; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b

      # 테스트는 한 번에 실행하고 결과 번들에서 타깃별 결과를 나눠 기록
      # 복제 시뮬레이터를 추가로 부팅하는 병렬 테스트는 CI에서 끔
      - name: Test
        id: test
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        shell: bash
        env:
          DEVICE_ID: ${{ steps.pick_ios.outputs.device_id }}
        run: |
          set -uo pipefail
          set -x

          RESULT_DIR="$GITHUB_WORKSPACE/test-results"
          RESULT_BUNDLE="$RUNNER_TEMP/${TEST_SCHEME}.xcresult"
          XCTESTRUN="$(find "$RUNNER_TEMP/derived-data/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          mkdir -p "$RESULT_DIR"
          rm -rf "$RESULT_BUNDLE"

          echo "== Starting xcodebuild test-without-building: ${TEST_SCHEME} =="

          # 테스트가 실패해도 타깃별 결과를 기록하려고 종료 코드를 직접 처리
          set +e
          xcodebuild \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RESULT_BUNDLE" \
            test-without-building \
            | tee "$RESULT_DIR/xcodebuild.log"
          XC_STATUS=${PIPESTATUS[0]}

          echo "== Finished xcodebuild test-without-building: ${TEST_SCHEME} (${XC_STATUS}) =="

          xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" > "$RUNNER_TEMP/test-results.json"

          set +x
          python3 - "$XCTESTRUN" "$RUNNER_TEMP/test-results.json" "$RESULT_DIR" "$XC_STATUS" <<'PY'
          import json, os, plistlib, shutil, sys

          xctestrun_path, tests_path, result_dir, status = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])
          scheme = os.environ["TEST_SCHEME"]
          workspace = os.environ["GITHUB_WORKSPACE"] + "/"
          passing = ("Passed", "Skipped", "Expected Failure")

          # 실행 대상 타깃은 xctestrun에서 읽어 결과가 빠진 타깃도 실패로 기록
          try:
            with open(xctestrun_path, "rb") as file:
              xctestrun = plistlib.load(file)
          except (OSError, plistlib.InvalidFileException):
            xctestrun = {}

          if "TestConfigurations" in xctestrun:
            targets = [
              target["BlueprintName"]
              for configuration in xctestrun["TestConfigurations"]
              for target in configuration["TestTargets"]
            ]
          else:
            targets = [name for name in xctestrun if name != "__xctestrun_metadata__"]

          bundles = {}

          def collect(node):
            if node["nodeType"] in ("Unit test bundle", "UI test bundle"):
              bundles[node["name"]] = node
              return
            for child in node.get("children", []):
              collect(child)

          try:
            with open(tests_path) as file:
              for node in json.load(file)["testNodes"]:
                collect(node)
          except (OSError, ValueError, KeyError):
            pass

          # 결과 번들이 없으면 타깃별로 나누지 않고 전체 로그로 기록
          if not bundles:
            targets = []

          def cases(node):
            if node["nodeType"] == "Test Case":
              yield node
              return
            for child in node.get("children", []):
              yield from cases(child)

          def failures(node, case):
            if node["nodeType"] == "Test Case":
              case = node.get("nodeIdentifier", node["name"])
            if node["nodeType"] == "Failure Message":
              location = node.get("sourceLocation")
              where = f"{location['filePath'].removeprefix(workspace)}:{location['lineNumber']}: " if location else ""
              yield f"✘ {case}"
              for line in f"{where}{node['name']}".splitlines():
                yield f"  {line}"
            for child in node.get("children", []):
              yield from failures(child, case)

          rows = []
          failed = False

          with open(os.path.join(result_dir, "summary.txt"), "w") as summary:
            for target in targets:
              bundle = bundles.get(target)
              if bundle is None:
                result, counts, lines = "No result", {}, ["✘ No test result was recorded for this target."]
              else:
                result = bundle.get("result", "unknown")
                counts = {}
                for case in cases(bundle):
                  counts[case.get("result")] = counts.get(case.get("result"), 0) + 1
                lines = list(failures(bundle, target))

              ok = result in passing
              failed = failed or not ok
              line = f"{target}: {result} (passed {counts.get('Passed', 0)}, failed {counts.get('Failed', 0)}, skipped {counts.get('Skipped', 0)})"
              rows.append((target, result, counts))

              with open(os.path.join(result_dir, f"{target}.log"), "w") as log:
                log.write("\n".join([line] + lines) + "\n")

              summary.write(f"scheme={target}\nstatus={0 if ok else 1}\n\n")
              print(line)
              for failure in lines:
                print(failure)

            # 타깃 결과로 설명되지 않는 실패는 전체 로그로 기록
            if status != 0 and not failed:
              shutil.copyfile(os.path.join(result_dir, "xcodebuild.log"), os.path.join(result_dir, f"{scheme}.log"))
              summary.write(f"scheme={scheme}\nstatus={status}\n\n")
              failed = True

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
            with open(step_summary, "a") as file:
              file.write("| Target | Result | Passed | Failed | Skipped |\n| --- | --- | --- | --- | --- |\n")
              for target, result, counts in rows:
                mark = "✅" if result in passing else "❌"
                file.write(f"| {target} | {mark} {result} | {counts.get('Passed', 0)} | {counts.get('Failed', 0)} | {counts.get('Skipped', 0)} |\n")

          sys.exit(status if status != 0 else int(failed))
          PY

      - name: Upload test logs
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: ios-test
          path: test-results
          if-no-files-found: ignore

      - name: Save SwiftPM packages
        if: github.event_name == 'push' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .spm
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Save compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/compilation-cache
          key: compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.version }}-arm64-${{ github.sha }}

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [ci]
    # 취소된 실행은 실패 댓글을 남기지 않음
    # push 실행의 fork 값은 비어 있어 이벤트 조건으로 제외
    if: |
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && (needs.ci.result == 'failure' || needs.ci.result == 'success')
    steps:
      - uses: actions/checkout@v5

      - name: Download CI logs
        if: needs.ci.result == 'failure'
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          path: test-artifacts

      - name: Delete resolved CI failure comments
        if: needs.ci.result == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            if (!context.payload.pull_request) {
              core.info('No PR context; skipping comment cleanup.');
              return;
            }

            const issueNumber = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const failureComments = comments.filter((comment) => {
              return comment.user?.type === 'Bot'
                && comment.body?.startsWith('❌ iOS CI failed.');
            });

            for (const comment of failureComments) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

      - name: Comment CI failure on PR
        if: needs.ci.result == 'failure'
        uses: actions/github-script@v8
        # 빌드가 성공한 뒤의 실패는 테스트 단계 실패로 처리
        env:
          BUILD_RESULT: ${{ needs.ci.outputs.build == 'success' && 'success' || 'failure' }}
          TEST_RESULT: ${{ needs.ci.outputs.build == 'success' && 'failure' || 'skipped' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const root = 'test-artifacts';

            function walk(directory) {
              if (!fs.existsSync(directory)) return [];
              const entries = fs.readdirSync(directory, { withFileTypes: true });
              return entries.flatMap((entry) => {
                const fullPath = path.join(directory, entry.name);
                return entry.isDirectory() ? walk(fullPath) : [fullPath];
              });
            }

            function cleanLine(line) {
              return line
                .replace(/\u001b\[[0-9;]*m/g, '')
                .trim()
                .slice(0, 300);
            }

            function extractFailureSnippet(logPath) {
              if (!fs.existsSync(logPath)) return '';

              const lines = fs.readFileSync(logPath, 'utf8').split(/\r?\n/);
              const importantPatterns = [
                /\.swift:\d+:\d+:\s+error:/,
                /Testing failed:/,
                /\*\* TEST FAILED \*\*/,
                /The following build commands failed:/,
                /Issue recorded:/,
                /Expectation failed:/,
                /✘/,
              ];
              const indexes = [];

              lines.forEach((line, index) => {
                if (importantPatterns.some((pattern) => pattern.test(line))) {
                  indexes.push(index);
                }
              });

              const selectedLines = [];
              const seenLines = new Set();

              for (const index of indexes.slice(0, 5)) {
                const start = Math.max(0, index - 2);
                const end = Math.min(lines.length, index + 9);
                for (const line of lines.slice(start, end)) {
                  const cleanedLine = cleanLine(line);
                  if (!cleanedLine || seenLines.has(cleanedLine)) continue;
                  seenLines.add(cleanedLine);
                  selectedLines.push(cleanedLine);
                }
              }

              return selectedLines.slice(0, 30).join('\n');
            }

            function extractBuildSection() {
              if (process.env.BUILD_RESULT !== 'failure') return '';

              const logPath = path.join(root, 'ios-build', 'build.log');
              let section = '## Build failed\n\n';

              if (!fs.existsSync(logPath)) {
                return section + 'No build log artifact was found. The build likely failed before xcodebuild started.\n\n';
              }

              const log = fs.readFileSync(logPath, 'utf8');
              const lines = log.split(/\r?\n/);
              const errorLines = lines
                .filter((line) => /^(.*?):(\d+):(\d+):\s+error:/i.test(line))
                .map(cleanLine)
                .filter(Boolean);

              if (errorLines.length <= 0) {
                return section + 'No compiler-style error diagnostics were found in build.log.\n\n';
              }

              section += 'Compiler error lines:\n\n```text\n' + errorLines.join('\n') + '\n```\n\n';

              const repoRoot = process.env.GITHUB_WORKSPACE || process.cwd();
              const snippets = [];

              for (const line of errorLines) {
                const match = line.match(/^(.*?):(\d+):(\d+):\s+error:/);
                if (!match) continue;

                const filePath = match[1];
                const lineNum = parseInt(match[2], 10);
                const absPath = filePath.startsWith('/') ? filePath : path.join(repoRoot, filePath);
                if (!fs.existsSync(absPath)) continue;

                const fileLines = fs.readFileSync(absPath, 'utf8').split(/\r?\n/);
                const start = Math.max(0, lineNum - 3);
                const end = Math.min(fileLines.length, lineNum + 2);
                const snippet = fileLines
                  .slice(start, end)
                  .map((sourceLine, index) => {
                    const currentLine = start + index + 1;
                    return `${currentLine.toString().padStart(4, ' ')}| ${sourceLine}`;
                  })
                  .join('\n');
                snippets.push(`File: ${filePath}:${lineNum}\n${snippet}`);
              }

              if (snippets.length <= 0) return section;

              return section + 'Code excerpts:\n\n```text\n' + snippets.join('\n\n') + '\n```\n\n';
            }

            function extractTestSection() {
              if (process.env.TEST_RESULT !== 'failure') return '';

              const summaries = [];

            for (const summaryPath of walk(root).filter((filePath) => path.basename(filePath) === 'summary.txt')) {
              const artifactName = summaryPath.split(path.sep)[1] || 'unknown';
              const artifactDirectory = path.dirname(summaryPath);
              const text = fs.readFileSync(summaryPath, 'utf8');
              const records = text
                .trim()
                .split(/\n\n+/)
                .map((record) => Object.fromEntries(
                  record
                    .split(/\r?\n/)
                    .filter(Boolean)
                    .map((line) => {
                      const index = line.indexOf('=');
                      return index < 0 ? [line, ''] : [line.slice(0, index), line.slice(index + 1)];
                    })
                ));

              for (const record of records) {
                if (record.status && record.status !== '0') {
                  const scheme = record.scheme || 'unknown';
                  const logPath = path.join(artifactDirectory, `${scheme}.log`);
                  summaries.push({
                    artifactName,
                    scheme,
                    status: record.status,
                    snippet: extractFailureSnippet(logPath),
                  });
                }
              }
            }

              let section = '## Tests failed\n\n';

              if (summaries.length <= 0) {
                return section + 'No failed scheme summary was found. Check the uploaded test log artifacts.\n\n';
              }

              section += 'Failed schemes:\n\n';
              for (const summary of summaries) {
                section += `- ${summary.scheme} (${summary.artifactName})\n`;
                if (summary.snippet) {
                  section += '\n```text\n' + summary.snippet + '\n```\n\n';
                } else {
                  section += '\nNo concise failure diagnostic was found in this scheme log.\n\n';
                }
              }

              return section + 'Check the uploaded test log artifacts for full diagnostics.\n\n';
            }

            const body = '❌ iOS CI failed.\n\n' + extractBuildSection() + extractTestSection();

            if (!context.payload.pull_request) {
              core.info('No PR context; skipping comment.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
